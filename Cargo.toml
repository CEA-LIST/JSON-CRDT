[package]
name = "json"
version = "0.1.0"
edition = "2024"

[dependencies]
moirai-crdt = { path = "../moirai/moirai-crdt" }
moirai-protocol = { path = "../moirai/moirai-protocol" }
moirai-macros = { path = "../moirai/moirai-macros" }
moirai-fuzz = { path = "../moirai/moirai-fuzz" }
petgraph = "0.8.3"
rand = "0.10.0"

[features]
default = ["fuzz", "sink"]
fuzz = []
sink = [
    "moirai-protocol/sink",
    "moirai-fuzz/sink",
    "moirai-macros/sink",
    "moirai-crdt/sink",
]
